name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because most findings arrive as new queries against unchanged
    # code rather than as new code.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-and-quality

      - name: Build for analysis
        # Compilation only: CodeQL needs the bytecode, not the test run, and
        # the tests already have a workflow of their own.
        run: bash ./mvnw -B -DskipTests compile

      - uses: github/codeql-action/analyze@v3
